<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="icon" type="image/png" href="images/money.webp" />
    <title>가계부 페이지</title>
  </head>
  <body>
    <!-- 헤더 -->
    <header id="header">
      <a href="#" id="logo-refresh" aria-label="페이지 새로고침">
        <img
          src="images/money.webp"
          alt="가계부 아이콘"
          width="30"
          height="30"
          loading="eager"
        />
      </a>
      <h1>지연이의 가계부</h1>
      <p>SOPT 38th WEB</p>
    </header>

    <!-- 메인 -->
    <main>
      <section id="search-filter">
        <h2>검색 필터</h2>
        <form id="search-filter-form" aria-label="검색 필터">
          <!-- 1행: 1개 -->
          <div class="filter-grid-row">
            <div class="filter-field">
              <label for="title">제목</label>
              <input
                type="text"
                id="title"
                name="title"
                placeholder="내역을 입력하세요"
                autocomplete="off"
              />
            </div>
          </div>

          <!-- 2행: 3개 -->
          <div class="filter-grid-row">
            <div class="filter-field">
              <label for="type">유형</label>
              <select id="type" name="type">
                <option value="">전체</option>
                <option value="income">수입</option>
                <option value="expense">지출</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="category">카테고리</label>
              <select id="category" name="category">
                <option value="">전체</option>
                <option value="식비">식비</option>
                <option value="문화">문화</option>
                <option value="교통">교통</option>
                <option value="생활">생활</option>
                <option value="월급">월급</option>
                <option value="기타">기타</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="payment">결제수단</label>
              <select id="payment" name="payment">
                <option value="">전체</option>
                <option value="신용카드">신용카드</option>
                <option value="체크카드">체크카드</option>
                <option value="현금">현금</option>
                <option value="기타">기타</option>
              </select>
            </div>
          </div>

          <div class="filter-actions" role="group" aria-label="필터 액션">
            <button type="submit" id="apply-filter" aria-label="필터 적용 버튼">
              적용
            </button>
            <button
              type="reset"
              id="reset-filter"
              aria-label="모든 필터 초기화 버튼"
            >
              초기화
            </button>
          </div>
        </form>
      </section>

      <section id="lists-section" aria-label="내역 목록">
        <header class="lists-header">
          <div class="lists-left-tools">
            <label for="sort-date" class="sr-only">날짜 정렬</label>
            <select id="sort-date" name="sort-date" aria-label="날짜 정렬">
              <option value="desc">날짜 내림차순</option>
              <option value="asc">날짜 오름차순</option>
            </select>
          </div>
          <div class="bulk-actions" role="group" aria-label="내역 관리 액션">
            <button
              type="button"
              id="delete-selected"
              aria-describedby="delete-help"
            >
              선택 삭제
            </button>
            <button type="button" id="add-expense" aria-describedby="add-help">
              추가
            </button>
          </div>
          <div id="delete-help" class="sr-only">
            삭제할 내역을 체크박스로 선택한 후 클릭하세요
          </div>
          <div id="add-help" class="sr-only">
            새 내역을 추가하려면 클릭하세요
          </div>
        </header>
        <div
          id="lists"
          aria-live="polite"
          role="region"
          aria-label="내역 목록"
        ></div>
      </section>
    </main>

    <!-- 추가 모달 -->
    <div
      id="add-modal"
      aria-hidden="true"
      role="dialog"
      aria-modal="false"
      aria-labelledby="add-modal-title"
      style="display: none"
    >
      <div class="modal-backdrop"></div>
      <div class="modal-content" role="document">
        <header class="modal-header">
          <h3 id="add-modal-title">내역 추가</h3>
          <button type="button" id="close-add-modal" aria-label="모달 닫기">
            <span aria-hidden="true">×</span>
          </button>
        </header>
        <div id="add-modal-description" class="sr-only">
          새로운 내역 정보를 입력하세요
        </div>
        <form id="add-expense-form" aria-label="내역 추가" novalidate>
          <!-- 1행: 1개 -->
          <div class="filter-grid-row single">
            <div class="filter-field">
              <label for="add-title">제목</label>
              <input
                type="text"
                id="add-title"
                name="title"
                placeholder="제목을 입력하세요"
                required
              />
            </div>
          </div>

          <!-- 2행: 2개 -->
          <div class="filter-grid-row double">
            <div class="filter-field">
              <label for="add-type">카테고리</label>
              <select id="add-type" name="type" required>
                <option value="">선택</option>
                <option value="income">수입</option>
                <option value="expense">지출</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="add-amount">금액 (숫자만)</label>
              <input
                type="number"
                id="add-amount"
                name="amount"
                placeholder="금액을 입력하세요"
                inputmode="numeric"
                min="0"
                step="1"
                required
              />
            </div>
          </div>

          <!-- 3행: 1개 -->
          <div class="filter-grid-row single">
            <div class="filter-field">
              <label for="add-date">날짜</label>
              <input type="date" id="add-date" name="date" required />
            </div>
          </div>

          <!-- 4행: 2개 -->
          <div class="filter-grid-row double">
            <div class="filter-field">
              <label for="add-category">분류</label>
              <select id="add-category" name="category" required>
                <option value="">선택</option>
                <option value="식비">식비</option>
                <option value="문화">문화</option>
                <option value="교통">교통</option>
                <option value="생활">생활</option>
                <option value="월급">월급</option>
                <option value="기타">기타</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="add-payment">결제수단</label>
              <select id="add-payment" name="payment" required>
                <option value="">선택</option>
                <option value="신용카드">신용카드</option>
                <option value="체크카드">체크카드</option>
                <option value="현금">현금</option>
                <option value="기타">기타</option>
              </select>
            </div>
          </div>

          <div class="filter-actions" role="group" aria-label="내역 추가 액션">
            <button type="submit" aria-describedby="submit-help">추가</button>
          </div>
          <div id="submit-help" class="sr-only">
            모든 필수 항목을 입력한 후 추가 버튼을 눌러주세요
          </div>
        </form>
      </div>
    </div>

    <!-- 상세 모달 -->
    <div
      id="detail-modal"
      aria-hidden="true"
      role="dialog"
      aria-modal="false"
      aria-labelledby="detail-modal-title"
      style="display: none"
    >
      <div class="modal-backdrop"></div>
      <div class="modal-content" role="document">
        <header class="modal-header">
          <h3 id="detail-modal-title">항목 상세</h3>
          <button type="button" id="close-detail-modal" aria-label="상세 모달 닫기">
            <span aria-hidden="true">×</span>
          </button>
        </header>
        <div id="detail-content" class="detail-content"></div>
      </div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
